    return [tx.dueDate, CATEGORY_LABELS[tx.category], tx.name, tx.type, tx.plannedAmount, state.settings.priorityNames[tx.priority]||"", tx.status, member, acct, tx.notes||""];
  });
  const csv = [header].concat(rows).map(r=>r.map(csvEscape).join(",")).join("\r\n");
  downloadTextFile("haven-transactions-"+todayISO()+".csv", csv, "text/csv");
  markExported(); toast("CSV exported.");
}
function summarizeState(s){
  return { transactions:(s.transactions||[]).length, accounts:(s.accounts||[]).length, debts:(s.debts||[]).length,
    sinkingFunds:(s.sinkingFunds||[]).length, investments:(s.investments||[]).length, challenges:(s.challenges||[]).length };
}
function importJsonBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let incoming;
    try{ incoming = JSON.parse(reader.result); }catch(e){ toast("That file isn't valid JSON."); return; }
    const before = summarizeState(Store.get());
    const after = summarizeState(incoming);
    openModal({
      title:"Confirm import",
      body:[
        h("p",{},["Importing this file will replace all data currently in Haven. This cannot be undone unless you have a separate backup."]),
        h("table.data-table",{},[
          h("thead",{},[h("tr",{},["","Current","Incoming"].map(l=>h("th",{},[l])))]),
          h("tbody",{}, Object.keys(before).map(k=>h("tr",{},[h("td",{},[k]),h("td",{},[String(before[k])]),h("td",{},[String(after[k])])])))
        ])
      ],
      footer:[
        h("button.btn",{onclick:()=>closeModal()},["Cancel"]),
        h("button.btn.btn-danger",{onclick:()=>{
          incoming.schemaVersion = incoming.schemaVersion || SCHEMA_VERSION;
          Store.set(migrateState(incoming));
          closeModal(); toast("Import complete."); renderShell(); Router.go("settings");
        }},["Replace my data"])
      ]
    });
  };
  reader.readAsText(file);
}
function openClearAllModal(){
  let confirmText = "";
  openModal({
    title:"Clear all data",
    body:[
      h("p",{},["This permanently erases every transaction, account, goal, and setting stored in Haven on this device. This cannot be undone."]),
      field('Type DELETE to confirm', h("input",{type:"text",oninput:(e)=>confirmText=e.target.value}))
    ],
    footer:[
      h("button.btn",{onclick:()=>closeModal()},["Cancel"]),
      h("button.btn.btn-danger",{onclick:()=>{
        if(confirmText.trim().toUpperCase()!=="DELETE"){ toast('Please type "DELETE" to confirm.'); return; }
        Store.set(defaultState());
        closeModal(); toast("All data cleared."); renderShell(); Router.go("dashboard");
      }},["Erase everything"])
    ]
  });
}
function storageUsageBytes(){
  try{ const raw = localStorage.getItem(PRIMARY_KEY); return raw? raw.length : 0; }catch(e){ return 0; }
}
function renderBackupPanel(){
  const state = Store.get();
  const kb = (storageUsageBytes()/1024).toFixed(1);
  mountContent(h("div", {}, [
    h("h2",{},["Backup & Data"]),
    h("div.card", {}, [
      h("h3",{},["Status"]),
      renderSaveIndicator(),
      h("p.muted",{style:"margin-top:8px;"},["Local storage used: ~"+kb+" KB. Last export: "+(state.settings.lastExportAt?fmtDate(state.settings.lastExportAt):"never")+"."]),
      !storageAvailable ? h("p",{style:"color:var(--danger);"},["Storage is unavailable this session — export a backup before closing this tab, or nothing will be kept."]) : null
    ]),
    h("div.card", {}, [
      h("h3",{},["Manual backup"]),
      h("p.muted",{},["Haven never syncs to the cloud. Export a JSON file to move your data to another device, or to keep as a personal backup."]),
      h("div.btn-row", {}, [
        h("button.btn.btn-primary", { onclick:()=>exportJsonBackup() }, [iconEl("export",{size:14}), "Export JSON"]),
        h("button.btn", { onclick:()=>exportCsvBackup() }, [iconEl("export",{size:14}), "Export CSV"]),
        h("label.btn", {}, [ iconEl("import",{size:14}), "Import JSON",
          h("input", { type:"file", accept:"application/json", style:"display:none;", onchange:(e)=>{ if(e.target.files[0]) importJsonBackup(e.target.files[0]); } })
        ])
      ])
    ]),
    h("div.card", {}, [
      h("h3",{},["Danger zone"]),
      h("p.muted",{},["Permanently erase everything stored in Haven on this device."]),
      h("button.btn.btn-danger", { onclick:()=>openClearAllModal() }, [iconEl("delete",{size:14}), "Clear all data"])
    ])
  ]));
}
registerRoute("backup", renderBackupPanel);

/* ===== SECTION: QUICK START GUIDE / FAQ ===== */
function renderGuide(){
  const steps = [
    { h:"1. Add your income", p:"Start in Transactions → Add transaction, choose the Income category, and enter what you expect to receive." },
    { h:"2. List your bills and expenses", p:"Add each recurring bill with a Monthly frequency — Haven will generate every future occurrence automatically." },
    { h:"3. Set monthly targets", p:"Visit Monthly Insights to set a target for each category and watch the progress ring fill in as you go." },
    { h:"4. Track accounts", p:"Add your checking, savings, and credit accounts in Accounts & Cards, then link transactions to them for automatic running balances." },
    { h:"5. Back up regularly", p:"Since Haven has no cloud sync, export a JSON backup from Setup → Backup & Data every so often." }
  ];
  const faq = [
    { q:"Does my data ever leave this device?", a:"No. Haven makes zero network requests. Everything is stored locally in this browser." },
    { q:"How do I use Haven on two devices?", a:"Export a JSON backup on one device, then import it on the other from Setup → Backup & Data." },
    { q:"What counts toward Left to Spend?", a:"Income received this month, minus cash bills/expenses/debt payments due this month (bills paid by credit card are excluded), minus savings contributions." },
    { q:"I lost my data after closing the browser.", a:"This usually means storage was unavailable that session (private browsing) or was cleared. Export backups often to protect against this." }
  ];
  mountContent(h("div", {}, [
    h("h2",{},["Quick Start Guide"]),
    h("div.card", {}, [ h("div.help-steps",{}, steps.map(s=>h("div.help-step",{},[h("h4",{},[s.h]),h("p",{},[s.p])]))) ]),
    h("h2",{style:"margin-top:24px;"},["FAQ"]),
    h("div.card", {}, faq.map(f=> h("details",{style:"margin-bottom:10px;"},[ h("summary",{style:"font-weight:700;cursor:pointer;"},[f.q]), h("p",{style:"margin:6px 0 0;color:var(--text-light);"},[f.a]) ]))),
    SUPPORT_TAGLINE
  ]));
}
const SUPPORT_TAGLINE = h("p.muted", { style:"margin-top:20px;" }, ["No broken formulas, no accidental row-shifting — Haven works fully offline, and your data never leaves this device."]);
registerRoute("guide", renderGuide);
</script>
